<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo interactivo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="mb-4">
            <h1 class="mb-1">Catálogo de productos</h1>
            <p class="text-secondary mb-0">
                Utilizá los controles para explorar los productos disponibles.
            </p>
        </div>

        <!-- BUSCADOR -->
        <div class="mb-3">

            <label for="buscador" class="form-label">
                Buscar producto
            </label>

            <input
                type="text"
                id="buscador"
                class="form-control"
                placeholder="Ej.: notebook, mouse, monitor...">

        </div>


        <!-- BOTONES -->
        <div class="d-flex flex-wrap gap-2 mb-4">

            <button
                id="btnTodos"
                class="btn btn-primary">
                Mostrar todos
            </button>

            <button
                id="btnDisponibles"
                class="btn btn-success">
                Mostrar disponibles
            </button>

            <button
                id="btnNotebooks"
                class="btn btn-secondary">
                Mostrar notebooks
            </button>

            <button
                id="btnCuatro"
                class="btn btn-warning">
                Mostrar 4 productos
            </button>

        </div>


        <!-- CONTADOR -->
        <div class="mb-3">

            <span class="text-secondary">
                Productos mostrados:
            </span>

            <strong id="cantidadProductos">0</strong>

        </div>


        <!-- CATÁLOGO -->
        <div
            id="catalogo"
            class="row g-3">
        </div>


        <!-- MENSAJE SIN RESULTADOS -->
        <div
            id="sinResultados"
            class="alert alert-warning mt-4 d-none">

            No se encontraron productos.

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
